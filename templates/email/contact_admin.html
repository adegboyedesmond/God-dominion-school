{% extends "email/layout.html" %}{% block body %}<h2 style="margin:0 0 12px;color:#24124f;font-size:21px">New website message</h2><table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border:1px solid #e4dff3;border-radius:8px;margin:14px 0;font-size:14px"><tr><td style="padding:6px 10px;background:#f6f3fd;font-weight:bold;width:40%">From</td><td style="padding:6px 10px">{{ m.name }}</td></tr><tr><td style="padding:6px 10px;background:#f6f3fd;font-weight:bold;width:40%">Phone</td><td style="padding:6px 10px">{{ m.phone }}</td></tr><tr><td style="padding:6px 10px;background:#f6f3fd;font-weight:bold;width:40%">Email</td><td style="padding:6px 10px">{{ m.email }}</td></tr><tr><td style="padding:6px 10px;background:#f6f3fd;font-weight:bold;width:40%">About</td><td style="padding:6px 10px">{{ m.subject }}</td></tr></table><p style="white-space:pre-line">{{ m.message }}</p>{% endblock %}
