<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ S.school_name }}</title></head>
<body style="margin:0;padding:0;background:#f3f0fb;font-family:Arial,Helvetica,sans-serif;color:#2d2742">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f0fb;padding:24px 10px">
<tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:14px;overflow:hidden">
    <tr><td style="background:#24124f;padding:20px 24px">
      <table role="presentation" cellpadding="0" cellspacing="0"><tr>
        <td><img src="{{ badge_url }}" width="58" alt="{{ S.school_name }} badge" style="display:block;border:0"></td>
        <td style="padding-left:14px;color:#ffffff">
          <div style="font-size:20px;font-weight:bold">{{ S.school_name }}</div>
          <div style="font-size:13px;color:#d9d2f3">{{ S.school_motto }}</div>
        </td></tr></table>
    </td></tr>
    <tr><td style="padding:28px 26px 10px;font-size:15px;line-height:1.6">
      {% block body %}{% endblock %}
    </td></tr>
    {% if button_url %}
    <tr><td style="padding:6px 26px 26px">
      <a href="{{ button_url }}" style="display:inline-block;background:#4a2a9c;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:999px">{{ button_text }}</a>
    </td></tr>
    {% endif %}
    <tr><td style="background:#f6f3fd;padding:18px 26px;font-size:12px;color:#625b78;line-height:1.5">
      {{ S.school_name }} · {{ S.school_address }}<br>
      {{ S.school_phone }} · {{ S.school_email }}<br>
      <a href="{{ home_url }}" style="color:#4a2a9c">Visit our website</a>
    </td></tr>
  </table>
</td></tr>
</table>
</body></html>
